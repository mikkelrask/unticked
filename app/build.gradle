plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.plugin.compose' }
def releaseSigning = ['UNTICKED_KEYSTORE_PATH', 'UNTICKED_KEYSTORE_PASSWORD',
                      'UNTICKED_KEY_ALIAS', 'UNTICKED_KEY_PASSWORD'].collectEntries {
    [(it): providers.environmentVariable(it).orNull]
}
def hasReleaseSigning = releaseSigning.values().every { it != null && !it.isEmpty() }
if (releaseSigning.values().any { it != null } && !hasReleaseSigning) {
    throw new GradleException('Release signing requires all four UNTICKED_KEYSTORE_* / UNTICKED_KEY_* variables.')
}
android {
    namespace = 'xyz.raske.unticked'
    compileSdk = 37
    buildToolsVersion = '37.0.0'
    defaultConfig {
        applicationId = 'xyz.raske.unticked'
        minSdk = 26
        targetSdk = 37
        versionCode = 12
        versionName = '0.1.0'
        testInstrumentationRunner = 'androidx.test.runner.AndroidJUnitRunner'
    }
    buildFeatures { compose = true }
    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile = file(releaseSigning.UNTICKED_KEYSTORE_PATH)
                storePassword = releaseSigning.UNTICKED_KEYSTORE_PASSWORD
                keyAlias = releaseSigning.UNTICKED_KEY_ALIAS
                keyPassword = releaseSigning.UNTICKED_KEY_PASSWORD
            }
        }
    }
    buildTypes {
        release {
            if (hasReleaseSigning) signingConfig = signingConfigs.release
        }
    }
    compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
    testOptions { unitTests.returnDefaultValues = true }
    lint { abortOnError = true }
}
tasks.register('verifyReleaseInputs') {
    doLast {
        if (!hasReleaseSigning) throw new GradleException('Release signing credentials are missing.')
        if (!file(releaseSigning.UNTICKED_KEYSTORE_PATH).isFile()) {
            throw new GradleException('Release keystore does not exist.')
        }
        def tag = providers.environmentVariable('UNTICKED_RELEASE_TAG').orNull
        if (tag != "v${android.defaultConfig.versionName}") {
            throw new GradleException('Release tag must equal v followed by the app versionName.')
        }
    }
}
dependencies {
    implementation project(':core')
    implementation platform('androidx.compose:compose-bom:2026.09.00')
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.11.0'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:rules:1.7.0'
    androidTestImplementation platform('androidx.compose:compose-bom:2026.09.00')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
